# Application
spring.application.name=expense-approval


# Database Configuration
# Update these values with your local PostgreSQL details

spring.datasource.url=jdbc:postgresql://localhost:5432/expenseflow
spring.datasource.username=your_username
spring.datasource.password=your_password


# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration

jwt.secret=replace_with_your_secret_key
jwt.expiration=86400000


# Server Configuration

server.port=8080